- name: Rebuild Entire Image List
  run: |
    echo "🔄 Rebuilding complete image list..."

    # 扫描所有图片文件（这里保持了只扫描 jpg，如果需要其他格式，按之前的加回来）
    FILES=$(find img/ -type f -iname "*.jpg" | sort)

    # 如果没有任何图片文件，生成空列表
    if [ -z "$FILES" ]; then
      echo "[]" > list.json
      echo "" > latest.txt
      echo "⚠️ No images found, generated empty list."
    else
      # 手动构建 JSON 数组
      echo "[" > list.json
      FIRST=true
      for f in $FILES; do
        # 构建完整的 CDN 链接
        URL="https://cdn.jsdelivr.net/gh/hxqemmm/picBed@latest/${f}"
        if [ "$FIRST" = true ]; then
          echo "  \"$URL\"" >> list.json
          FIRST=false
        else
          echo "  ,\"$URL\"" >> list.json
        fi
      done
      echo "]" >> list.json
      
      echo "✅ list.json rebuilt."

      # 更新 latest.txt（取最后一行作为最新图片）
      LAST_URL=$(grep -o 'https://[^"]*' list.json | tail -1)
      if [ -n "$LAST_URL" ]; then
        echo "$LAST_URL" > latest.txt
        echo "Latest image: $LAST_URL"
      fi
    fi

    # 提交改动
    git config user.name "github-actions[bot]"
    git config user.email "actions@github.com"
    git add list.json latest.txt
    if ! git diff --cached --quiet; then
      git commit -m "🔄 Sync full image list [skip ci]"
      git push
    else
      echo "No changes to commit."
    fi
