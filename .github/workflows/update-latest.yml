name: Auto tag and update latest

on:
  push:
    paths:
      - 'img/**'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 必须的，允许推送标签
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 拉取所有历史和标签
          token: ${{ secrets.GITHUB_TOKEN }}  # 显式使用默认令牌

      - name: Generate new tag and update latest.txt
        run: |
          # 获取当前最大的数字标签
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1"
          else
            NUM=$(echo $LATEST_TAG | sed 's/v//')
            NEW_NUM=$((NUM + 1))
            NEW_TAG="v$NEW_NUM"
          fi
          echo "New tag: $NEW_TAG"

          # 获取本次上传的图片文件名（取第一个）
          NEW_FILES=$(git diff --name-only HEAD^ HEAD -- img/ 2>/dev/null || echo "")
          if [ -z "$NEW_FILES" ]; then
            NEW_FILES=$(find img/ -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" -o -iname "*.webp" \))
          fi
          LATEST_IMAGE=$(echo "$NEW_FILES" | grep -E '\.(jpg|jpeg|png|gif|webp)$' | head -1)
          if [ -z "$LATEST_IMAGE" ]; then
            echo "No new image found."
            exit 0
          fi
          echo "Latest image: $LATEST_IMAGE"

          # 直接把完整 CDN 链接写入 latest.txt
          IMG_URL="https://cdn.jsdelivr.net/gh/hxqemmm/picBed@${NEW_TAG}/${LATEST_IMAGE}"
          echo "$IMG_URL" > latest.txt

          # 提交 latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update latest.txt to ${IMG_URL}"
            git push
          fi

          # 打标签并推送
          git tag $NEW_TAG
          git push origin $NEW_TAG

          # 把标签号也保存到环境变量，方便调试
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
