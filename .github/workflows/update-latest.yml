name: Auto tag and update image list

on:
  push:
    paths:
      - 'img/**'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate new tag and update list.json
        run: |
          # 计算新版本号
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1"
          else
            NUM=$(echo $LATEST_TAG | sed 's/v//')
            NEW_NUM=$((NUM + 1))
            NEW_TAG="v$NEW_NUM"
          fi
          echo "New tag: $NEW_TAG"

          # 获取本次上传的第一个图片文件
          NEW_FILES=$(git diff --name-only HEAD^ HEAD -- img/ 2>/dev/null || echo "")
          if [ -z "$NEW_FILES" ]; then
            NEW_FILES=$(find img/ -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" -o -iname "*.webp" \))
          fi
          LATEST_IMAGE=$(echo "$NEW_FILES" | grep -E '\.(jpg|jpeg|png|gif|webp)$' | head -1)
          if [ -z "$LATEST_IMAGE" ]; then
            echo "No new image found."
            exit 0
          fi
          echo "Latest image: $LATEST_IMAGE"

          # 构建新图片的完整 CDN 链接
          IMG_URL="https://cdn.jsdelivr.net/gh/hxqemmm/picBed@${NEW_TAG}/${LATEST_IMAGE}"

          # 处理 list.json（如果不存在则创建）
          if [ ! -f list.json ]; then
            echo '[]' > list.json
          fi
          # 将新图片链接追加到数组最前面（最新的在最前）
          jq --arg url "$IMG_URL" '. = [$url] + .' list.json > tmp.json && mv tmp.json list.json

          # 提交 list.json
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add list.json
          git commit -m "Add image $LATEST_IMAGE to list [skip ci]"
          git push

          # 打标签并推送
          git tag $NEW_TAG
          git push origin $NEW_TAG
