name: Update latest image info

on:
  push:
    paths:
      - 'img/**'

jobs:
  update-latest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest changed image and update latest.txt
        run: |
          # 获取本次推送中，img 目录下新增或修改的文件
          NEW_FILES=$(git diff --name-only HEAD^ HEAD -- img/ 2>/dev/null || echo "")

          # 如果获取失败（比如首次推送），则直接取 img 下所有图片文件
          if [ -z "$NEW_FILES" ]; then
            NEW_FILES=$(find img/ -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.gif" -o -iname "*.webp" \))
          fi

          # 过滤出图片文件，并取第一个作为最新图片
          LATEST_IMAGE=$(echo "$NEW_FILES" | grep -E '\.(jpg|jpeg|png|gif|webp)$' | head -1)
          
          if [ -z "$LATEST_IMAGE" ]; then
            echo "No image file changed in this push."
            exit 0
          fi
          
          echo "Latest image: $LATEST_IMAGE"
          echo "$LATEST_IMAGE" > latest.txt

          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update latest.txt to $LATEST_IMAGE"
            git push
          else
            echo "latest.txt is already up-to-date."
          fi
